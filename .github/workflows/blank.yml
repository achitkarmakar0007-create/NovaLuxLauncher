name: Build NovaLux APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Project found in repository root"
          elif [ -f NovaLuxLauncher/settings.gradle ] || [ -f NovaLuxLauncher/settings.gradle.kts ]; then
            cd NovaLuxLauncher
          else
            echo "ERROR: Android project settings.gradle not found"
            find . -maxdepth 3 -type f | head -60
            exit 1
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaLuxLauncher-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
